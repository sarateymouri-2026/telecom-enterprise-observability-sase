---
- name: Deploy Prometheus Node Exporter to Edge & Cloud Infrastructure
  hosts: all
  become: yes
  vars:
    node_exporter_version: "1.6.1"
    node_exporter_bin_dir: "/usr/local/bin"
    node_exporter_user: "node_exporter"
    node_exporter_group: "node_exporter"

  tasks:
    - name: Create node_exporter service group
      ansible.builtin.group:
        name: "{{ node_exporter_group }}"
        state: present

    - name: Create node_exporter service user
      ansible.builtin.user:
        name: "{{ node_exporter_user }}"
        group: "{{ node_exporter_group }}"
        shell: /sbin/nologin
        create_home: no

    - name: Download and unarchive Node Exporter release binary
      ansible.builtin.unarchive:
        src: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: /tmp/
        remote_src: yes

    - name: Copy Node Exporter binary to destination folder
      ansible.builtin.copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: "{{ node_exporter_bin_dir }}/node_exporter"
        owner: "{{ node_exporter_user }}"
        group: "{{ node_exporter_group }}"
        mode: "0755"
        remote_src: yes

    - name: Install systemd service unit file for Node Exporter
      ansible.builtin.copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          Wants=network-online.target
          After=network-online.target

          [Service]
          User={{ node_exporter_user }}
          Group={{ node_exporter_group }}
          Type=simple
          ExecStart={{ node_exporter_bin_dir }}/node_exporter

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd daemon and enable node_exporter
      ansible.builtin.systemd:
        name: node_exporter
        state: started
        enabled: yes
        daemon_reload: yes
